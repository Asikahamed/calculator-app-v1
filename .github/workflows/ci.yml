name: "Java Maven CI"

on:
  push:
    branches:
      - main
      - master
      - 'release/*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (compile & package, skip tests)
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine Maven command
        id: mvn
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "MAVEN_CMD=./mvnw" >> $GITHUB_OUTPUT
          else
            echo "MAVEN_CMD=mvn" >> $GITHUB_OUTPUT
          fi

      - name: Build and package (skip tests)
        env:
          MAVEN_CMD: ${{ steps.mvn.outputs.MAVEN_CMD }}
        run: |
          set -euo pipefail
          echo "Using Maven command: $MAVEN_CMD"
          $MAVEN_CMD -B -T 1C -DskipTests=true package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/*.ear
          if-no-files-found: ignore

  test:
    name: Test (unit / integration)
    runs-on: ubuntu-latest
    needs: build
    env:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine Maven command
        id: mvn2
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "MAVEN_CMD=./mvnw" >> $GITHUB_OUTPUT
          else
            echo "MAVEN_CMD=mvn" >> $GITHUB_OUTPUT
          fi

      - name: Run tests (su refire/failsafe)
        env:
          MAVEN_CMD: ${{ steps.mvn2.outputs.MAVEN_CMD }}
        run: |
          set -euo pipefail
          echo "Running tests with: $MAVEN_CMD"
          # Run tests (unit & integration as configured); produce surefire/failsafe reports
          $MAVEN_CMD -B -T 1C -DskipTests=false test

      - name: Collect test reports
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-reports
          cp -r **/target/surefire-reports $GITHUB_WORKSPACE/test-reports 2>/dev/null || true
          cp -r **/target/failsafe-reports $GITHUB_WORKSPACE/test-reports 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: $GITHUB_WORKSPACE/test-reports
          if-no-files-found: ignore

  artifacts:
    name: Artifacts (gather & validate)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts
          if-no-files-found: ignore

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: List gathered files
        run: |
          echo "Build artifacts:"
          ls -la build-artifacts || true
          echo "Test reports:"
          ls -la test-results || true

      - name: Re-upload combined package (optional)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-delivery
          path: |
            build-artifacts/**
            test-results/**
          if-no-files-found: ignore