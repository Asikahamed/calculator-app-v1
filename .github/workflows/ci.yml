name: "Java Maven CI"

on:
  push:
    branches:
      - main
      - master
      - 'release/*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build (compile & package, skip tests)
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine Maven command
        id: mvn
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "MAVEN_CMD=./mvnw" >> $GITHUB_OUTPUT
          else
            echo "MAVEN_CMD=mvn" >> $GITHUB_OUTPUT
          fi

      - name: Build and package (skip tests)
        env:
          MAVEN_CMD: ${{ steps.mvn.outputs.MAVEN_CMD }}
        run: |
          set -euo pipefail
          echo "Using Maven command: $MAVEN_CMD"
          $MAVEN_CMD -B -T 1C -DskipTests=true package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/target/*.jar
            **/target/*.war
            **/target/*.ear
          if-no-files-found: ignore

  test:
    name: Test (unit / integration)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      test_reports_present: ${{ steps.check_reports.outputs.found }}
    env:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine Maven command
        id: mvn2
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            echo "MAVEN_CMD=./mvnw" >> $GITHUB_OUTPUT
          else
            echo "MAVEN_CMD=mvn" >> $GITHUB_OUTPUT
          fi

      - name: Install Xvfb and minimal GUI libs (for AWT/Swing tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libxrender1 libxtst6 fontconfig

      - name: Run tests under virtual X server (Xvfb)
        env:
          MAVEN_CMD: ${{ steps.mvn2.outputs.MAVEN_CMD }}
        run: |
          set -euo pipefail
          echo "Running tests with virtual X server via xvfb-run"
          xvfb-run -a -s "-screen 0 1920x1080x24" $MAVEN_CMD -B -T 1C -DskipTests=false test

      - name: Collect test reports
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-reports
          cp -r **/target/surefire-reports $GITHUB_WORKSPACE/test-reports 2>/dev/null || true
          cp -r **/target/failsafe-reports $GITHUB_WORKSPACE/test-reports 2>/dev/null || true

      - name: Check for test reports
        id: check_reports
        run: |
          set -e
          REPORT_COUNT=$(find $GITHUB_WORKSPACE/test-reports -type f | wc -l || true)
          if [ "${REPORT_COUNT:-0}" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results
        if: steps.check_reports.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: $GITHUB_WORKSPACE/test-reports

  artifacts:
    name: Artifacts (gather & validate)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts
          if-no-files-found: ignore

      - name: Download test results
        if: needs.test.outputs.test_reports_present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: Skip test results notice
        if: needs.test.outputs.test_reports_present != 'true'
        run: echo "No test-results artifact produced by test job; skipping download."

      - name: List gathered files
        run: |
          echo "Build artifacts:"
          ls -la build-artifacts || true
          echo "Test reports:"
          ls -la test-results || true

  docker:
    name: Build & Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine image name
        id: image
        run: |
          # use the repository name as image name (owner/repo -> repo)
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "IMAGE_NAME=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.IMAGE_NAME }}:latest

      - name: Output image reference
        run: | 
          echo "Pushed image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.IMAGE_NAME }}:${{ github.sha }}"